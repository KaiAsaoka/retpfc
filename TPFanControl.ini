; reTPFC configuration file
; Lines starting with ; / or # are comments
;
; This file controls how reTPFC monitors temperatures and manages fan speed
; on ThinkPad laptops. Place this file in the same directory as the executable.

; ============================================================================
; General Settings
; ============================================================================

; Operating mode on startup:
;   0 = Read-only (monitor temperatures, never write to EC)
;   1 = Disabled (fan control off, application idle)
;   2 = Smart (automatic fan control using the fan curve below)
;   3 = Manual (fixed fan speed set by ManFanSpeed)
Active=2

; How often (in seconds) to read temperatures from the EC.
; Lower values = more responsive but more EC bus traffic.
Cycle=5

; How often (in seconds) to update the system tray icon.
; Can be faster than Cycle since it just redraws the icon.
IconCycle=1

; Default fan level for Manual mode (0-7).
;   0 = fan off
;   7 = maximum speed
ManFanSpeed=0

; Safety threshold for Manual mode (in Celsius).
; If any sensor exceeds this temperature, the controller automatically
; switches from Manual mode to Smart mode to prevent overheating.
ManModeExit=78

; Number of consecutive EC read failures before the controller gives up
; and reverts to BIOS mode (letting the EC firmware control the fan).
; This is a safety fallback in case the EC becomes unresponsive.
MaxReadErrors=10

; Start the application minimized to the system tray (1=yes, 0=no).
; When minimized, the app runs in the background with only a tray icon visible.
StartMinimized=1

; Keep the settings window above all other windows (1=yes, 0=no).
StayOnTop=1

; Use a compact/slim settings dialog layout (1=yes, 0=no).
SlimDialog=0

; Tray icon display mode:
;   1 = Show current temperature as text in the icon
;   0 = Show a color-coded icon (blue=cool, yellow=warm, red=hot)
ShowTempIcon=1

; Tint the tray icon green when the fan is actively spinning (1=yes, 0=no).
; Only applies when ShowTempIcon=0 (color icon mode).
IconColorFan=1

; Write debug log to file (1=yes, 0=no).
; Log file is created in the same directory as the executable.
Log2File=0

; Write temperature and fan data to a CSV file (1=yes, 0=no).
; Useful for analyzing thermal behavior over time.
Log2csv=0

; ============================================================================
; Fan Curve (Smart Mode)
; ============================================================================
;
; Defines the temperature-to-fan-speed mapping used in Smart mode.
; Format: Level=TEMPERATURE FAN_LEVEL HYSTERESIS_UP HYSTERESIS_DOWN
;
; TEMPERATURE    - Activate this level at or above this temp (Celsius)
; FAN_LEVEL      - EC fan speed (0=off, 1-6=intermediate, 7=max)
; HYSTERESIS_UP  - Extra degrees above TEMPERATURE needed to activate
;                  (prevents rapid toggling when temp hovers near a boundary)
; HYSTERESIS_DOWN - Extra degrees below TEMPERATURE needed to deactivate
;
; Temperatures must be in ascending order.
; The last entry must be the terminator: Level=-1 0
;
; Example: "Level=65 4 2 0" means fan level 4 activates at 67C (65+2)
;          but won't deactivate until temp drops below 65C.

Level=50 0 0 0
Level=55 2 0 0
Level=60 3 0 0
Level=65 4 2 0
Level=70 5 2 0
Level=75 6 0 0
Level=80 7 0 0
Level=-1 0

; Secondary fan curve (optional). Uses "Level2=" prefix.
; Used for Smart Mode 2 if the application supports dual profiles.
; Same format as the primary curve above.

; ============================================================================
; Sensor Configuration
; ============================================================================
;
; ThinkPads have up to 12 temperature sensors. By default they are named:
;   1=cpu  2=aps  3=crd  4=gpu  5=bat  6=x7d  7=bat  8=x7f
;   9=bus  10=pci 11=pwr 12=xc3
;
; Sensors reading 0x00, 0x80, or >127 are treated as inactive/invalid.

; Override the default 3-character name for a sensor.
; Format: SensorNameN=name (where N is the 1-based sensor number)
SensorName1=cpu
SensorName4=gpu

; Apply a temperature offset (in Celsius) to a sensor's readings.
; Format: SensorOffsetN=offset1 offset2 offset3
; Each value applies to a different fan curve lookup context.
; Positive values subtract from the reading (sensor reads hotter than actual).
; Use -1 to skip/ignore that offset slot.
SensorOffset1=5 -1 -1

; Comma-separated list of sensor names to exclude from the max-temperature
; calculation. The fan curve uses the highest reading across all non-ignored
; sensors, so excluding noisy or irrelevant sensors improves fan behavior.
IgnoreSensors=pci,aps

; ============================================================================
; Hotkeys
; ============================================================================
;
; Global keyboard shortcuts to switch fan modes from anywhere.
; Format: HK_MODE=MODIFIER KEY
;
; Modifier values:
;   1 = Ctrl
;   2 = Shift
;   3 = Ctrl+Shift
;   4 = Alt
;   5 = Alt+Shift
;
; KEY is a single character (uppercase).

HK_BIOS=3 B
HK_Smart=3 S
HK_Manual=3 M
